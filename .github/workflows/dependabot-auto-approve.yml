# ============================================================
# dependabot-auto-approve.yml — zrl.dev
# Approves Dependabot patch/minor PRs and enables GitHub auto-merge.
#
# IMPORTANT: This workflow does NOT wait for CI. Merge gating is done by
# branch protection on `main`: required status checks (e.g. secured_ci)
# must pass before GitHub's auto-merge completes the squash merge.
# Major updates are left for manual review.
#
# Requires repo settings: "Allow auto-merge" enabled, and branch
# protection / ruleset on main with required status checks.
# ============================================================

name: Dependabot Auto-Merge

on:
  pull_request_target:  # needed so Dependabot PRs get a write-scoped token
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No checkout: never run PR code under pull_request_target.
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and enable auto-merge (patch/minor only)
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
